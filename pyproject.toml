[project]
name = "hypnos"
version = "0.3.0"
description = "Minimal inference library for Hypnos: load an EDF, preprocess, and generate sleep embeddings from pretrained checkpoints."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jonathan Carter"}
]
keywords = ["sleep", "eeg", "ecg", "physiology", "embeddings", "foundation-model",
            "time-series", "polysomnography", "edf", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",          # torch.nn.attention.flex_attention (hypnos.models.attention)
    "numpy",
    "scipy",               # resample_poly / butter / sosfilt / iirnotch (preprocessing)
    "pyedflib>=0.1.37",    # EDF/EDF+ reading
    "huggingface-hub>=0.23.0",  # download the model bundle from the Hub
    "safetensors>=0.4.0",  # single-file model bundle format
    "fsspec",              # SignalTokenizer.from_checkpoint hf:// / s3:// support
]

[project.urls]
Homepage = "https://github.com/joncarter1/hypnos"
Repository = "https://github.com/joncarter1/hypnos"
Paper = "https://arxiv.org/abs/2606.09605"
"Hugging Face" = "https://huggingface.co/joncarter/hypnos"

[dependency-groups]
# Dev-only: resolving checkpoints/configs from the research stack when seeding manifests.
seed = [
    "mlflow>=3.7.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypnos"]

[tool.ruff]
line-length = 120
